enable_audio_bell no

copy_on_select yes
strip_trailing_spaces smart

map ctrl+shift+n new_os_window_with_cwd

# Mouse config
# wheel_scroll_multiplier 10.0

# Scrollback

scrollback_fill_enlarged_window yes

# Font
# font_family Iosevka-Term-SS05
# bold_font Iosevka-Term-SS05-Heavy
# italic_font Iosevka-Term-SS05-Light-Italic
# bold_italic_font Iosevka-Term-SS05-Heavy-Italic

# Nerd fonts
# symbol_map U+E5FA-U+F400 SymbolsNerdFontComplete-1000-em

font_size 11

# In points, vertical horizontal
window_padding_width 3 3
# background_opacity .98

disable_ligatures always
confirm_os_window_close 0

# Blue
url_color #81a2be
url_style double

# Based on https://github.com/morhetz/gruvbox by morhetz <morhetz@gmail.com>
# Adapted to kitty by wdomitrz <witekdomitrz@gmail.com>

cursor                  #928374

background              #282828
foreground              #ebdbb2
selection_foreground    #928374
selection_background    #3c3836

# black
color0                  #282828
color8                  #928374

# red
color1                  #cc241d
color9                  #fb4934

#: green
color2                  #98971a
color10                 #b8bb26

# yellow
color3                  #d79921
color11                 #fabd2d

# blue
color4                  #458588
color12                 #83a598

# purple
color5                  #b16286
color13                 #d3869b

# aqua
color6                  #689d6a
color14                 #8ec07c

# white
color7                  #a89984
color15                 #928374


# BEGIN_KITTY_FONTS
font_family      family='Iosevka Slab' features=+ss05
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
